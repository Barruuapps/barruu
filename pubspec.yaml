name: barruu
description: "Offline-first, block-based knowledge and interactive content platform — build documents, educational books, notes, and interactive learning experiences with a modern block editor."
publish_to: 'none'
version: 1.0.1+12

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  iconsax_plus: ^1.0.0
  logger: ^2.7.0
  shared_preferences: ^2.5.3
  flutter_riverpod: ^3.3.1
  go_router: ^18.0.0
  just_audio: ^0.10.5
  flutter_math_fork: ^0.7.4
  math_expressions: ^3.1.0
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  path_provider: ^2.1.5
  file_picker: ^10.3.10  # TODO: v11 removes FilePicker.platform; migrate to new FilePicker API
  uuid: ^4.5.3
  flutter_colorpicker: ^1.1.0
  video_player: ^2.11.1
  image_picker: ^1.2.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0+2
  sqlite3_flutter_libs: ^0.6.0
  cached_network_image: ^3.4.1
  app_links: ^7.2.1
  archive: ^4.0.9
  share_plus: ^12.0.0
  encrypt: ^5.0.3
  path: ^1.9.1
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^34.1.32
  graphview: ^1.2.0
  intl: ^0.20.2
  timeago: ^3.7.1
  url_launcher: ^6.3.1
  http: any
  rxdart: ^0.28.0
  shimmer: ^3.0.0
  youtube_player_flutter: ^9.1.1  # TODO: v10 has breaking API changes (YoutubePlayerFlags, ProgressBarColors removed, controller API changed)
  flutter_dotenv: ^6.0.1
  pointycastle: any
  permission_handler: ^12.0.1
  record: ^6.2.0
  connectivity_plus: ^7.0.0
  flutter_local_notifications: ^22.1.0
  table_calendar: ^3.2.0
  timezone: ^0.11.0
  flutter_markdown_plus: ^1.0.7
  json_annotation: ^4.11.0
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.5.4
  freezed_annotation: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.1
  build_runner: ^2.13.1
  freezed: ^3.2.3

dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/app_icons/
    - assets/app_background/
    - .env