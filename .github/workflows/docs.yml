name: Documentation

on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: '.markdownlint.yaml'
          globs: |
            **/*.md
            !**/ios/**
            !**/android/**
            !**/macos/**
            !**/windows/**
            !**/linux/**
            !**/build/**
            !**/.dart_tool/**
            !**/target/**
            !**/node_modules/**

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --no-progress
            --accept 200,201,204,301,302,429
            --timeout 15
            --retry-wait-time 5
            --max-retries 3
            '**/*.md'
          fail: false