name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact-name: barruu-linux-x86_64
            build-command: flutter build linux --release
            asset-path: build/linux/x64/release/bundle/
            asset-glob: '*.tar.gz'
          - os: macos-latest
            platform: macos
            artifact-name: barruu-macos
            build-command: flutter build macos --release
            asset-path: build/macos/Build/Products/Release/Barruu.app
            asset-glob: '*.dmg'
          - os: windows-latest
            platform: windows
            artifact-name: barruu-windows-x86_64
            build-command: flutter build windows --release
            asset-path: build/windows/x64/runner/Release/
            asset-glob: '*.zip'

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build-command }}

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          cd build/linux/x64/release/
          tar -czf barruu-linux-x86_64.tar.gz bundle/
          mv barruu-linux-x86_64.tar.gz ${{ github.workspace }}/

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          cd build/macos/Build/Products/Release/
          hdiutil create -volname Barruu -srcfolder Barruu.app -ov -format UDZO barruu-macos.dmg
          mv barruu-macos.dmg ${{ github.workspace }}/

      - name: Package Windows
        if: matrix.platform == 'windows'
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath barruu-windows-x86_64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Barruu ${{ github.ref_name }}
          body: |
            # Barruu ${{ github.ref_name }}

            ## Installation

            - **Linux**: Download `barruu-linux-x86_64.tar.gz`, extract, and run `bundle/barruu`
            - **macOS**: Download `barruu-macos.dmg`, open, and drag Barruu to Applications
            - **Windows**: Download `barruu-windows-x86_64.zip`, extract, and run `barruu.exe`

            ## Changes

            See [CHANGELOG.md](https://github.com/Barruuapps/barruu/blob/main/CHANGELOG.md) for details.

            ## Checksums

            ```
            ${{ steps.checksums.outputs.sha256 }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            barruu-linux-x86_64.tar.gz
            barruu-macos.dmg
            barruu-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}