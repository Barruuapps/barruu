# Barruu GitHub Labels Configuration

# Issue types
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "discussion"
  color: "d4c5f9"
  description: "Open discussion topic"

# Priority
- name: "priority: critical"
  color: "b60205"
  description: "Must be fixed immediately"
- name: "priority: high"
  color: "d93f0b"
  description: "Should be addressed soon"
- name: "priority: medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# Status
- name: "triage"
  color: "ededed"
  description: "Needs initial triage"
- name: "blocked"
  color: "000000"
  description: "Blocked by another issue or PR"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or PR already exists"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

